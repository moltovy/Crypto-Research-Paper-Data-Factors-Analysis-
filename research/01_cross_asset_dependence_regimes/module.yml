- S2 matched returns
- leave-one-out PC1
- BTC tail indicator
frequencies:
- crypto daily
methods:
- Leave-one-out PCA
- Tail dependence
- Moving-block inference
- Relative-risk diagnostics
sensitivity_dimensions:
- tail threshold
- block length
- factor composition
