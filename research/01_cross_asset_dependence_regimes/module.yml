module_id: 01_cross_asset_dependence_regimes
title: Cross-Asset Dependence and Regimes
research_question: How do crypto and TradFi return dependence, common-factor share,
  lower-tail co-exceedance, and regimes vary across matched samples?
research_questions:
- How much of each S2 asset's matched return variation is shared with a leave-one-out
  crypto factor?
- How far does lower-tail co-exceedance depart from its independence benchmark across
  predeclared thresholds?
outcomes:
- common variance share
- tail co-exceedance
- expected shortfall
