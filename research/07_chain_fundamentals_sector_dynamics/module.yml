module_id: 07_chain_fundamentals_sector_dynamics
title: Chain Fundamentals and Sector Dynamics
research_question: Which chain-level activity, sector, and point-in-time state measures
  have enough coverage and definition clarity for descriptive panel analysis?
research_questions:
- How did PIT concentration, entropy-implied breadth, turnover, entry, exit, and survival
  change across complete months?
- Can each concentration change be reconciled exactly to incumbent, entry, and exit
  components, and is the optional chain panel eligible?
