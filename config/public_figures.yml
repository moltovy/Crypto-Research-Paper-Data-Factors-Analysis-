figures:
- figure_id: common_factor_tail_dependence
  filename: research/01_cross_asset_dependence_regimes/figures/01_common_factor_tail_dependence.png
  root_order: 1
  status: public
  research_question: How broad are common variation and lower-tail co-exceedance within the fixed S2 crypto core?
  source_tables: research/01_cross_asset_dependence_regimes/tables/common_factor_results.csv; research/01_cross_asset_dependence_regimes/tables/tail_dependence.csv
  chart_type: leave_one_out_factor_and_tail_forest
  method: Leave-one-out PCA plus moving-block bootstrap tail co-exceedance inference at predeclared quantiles
  units: variance share and excess joint probability
  uncertainty: 2,000-replication moving-block bootstrap intervals with block-length sensitivity
  date_range: 2021-01-02 through 2026-06-30
  sample: S2 fixed stable core, 2021-01-02 through 2026-06-30, n=2006 matched returns
  caption: Common variation is broad, and BTC lower-tail co-exceedance is above its independence benchmark for the shown pairs.
  caveat: Fixed PIT-eligible membership supports within-sample dependence statements, not forecasts, causal transmission, or investability claims.
  svg_required: true
  visual_qa_status: pass_2026-07-20_full_size_thumbnail_svg_readme_pdf
- figure_id: dynamic_tradfi_integration
  filename: research/02_macro_tradfi_integration/figures/02_dynamic_tradfi_integration.png
  root_order: 2
  status: public
  research_question: How do conditional crypto-equity exposures vary over time and across a predeclared era split?
  source_tables: research/02_macro_tradfi_integration/tables/dynamic_tradfi_exposures.csv; research/02_macro_tradfi_integration/tables/break_tests.csv
  chart_type: rolling_exposure_and_interaction_forest
  method: 252-session multivariate HAC exposure with 126-session minimum and formal era interactions
  units: conditional QQQ beta
  uncertainty: HAC confidence intervals and multiplicity-adjusted formal interaction tests
  date_range: 2020-01-03 through 2026-04-14
  sample: XNYS-aligned BTC/ETH and TradFi observations, 2020-01-03 through 2026-04-14, n=1577
  caption: Conditional QQQ exposure varies over time, while formal ETF-era interaction estimates are weak.
  caveat: Contemporaneous period comparisons do not identify ETF effects or causal transmission.
  svg_required: true
  visual_qa_status: pass_2026-07-20_full_size_thumbnail_svg_readme_pdf
- figure_id: institutional_market_plumbing
  filename: research/04_etf_institutional_flows/figures/04_institutional_market_plumbing.png
  root_order: 3
  status: public
  research_question: How do ETF flow-intensity lag associations and regulated-futures positioning line up with market outcomes?
  source_tables: research/04_etf_institutional_flows/tables/etf_distributed_lags.csv; research/04_etf_institutional_flows/tables/institutional_positioning_eras.csv
  chart_type: simultaneous_lag_forest_and_positioning_eras
  method: Distributed-lag HAC regression with moving-block max-t bands plus descriptive CFTC positioning eras
  units: return coefficient per flow-intensity basis point and net share of open interest
  uncertainty: 2,000-replication moving-block simultaneous max-t intervals for ETF lags
  date_range: 2024-01-11 through 2026-06-30, instrument-specific support
  sample: Actual BTC/ETH ETF report dates through 2026-04-10 and CFTC standard contracts through 2026-06-30
  caption: ETF lag evidence is mostly weak under simultaneous bands; CFTC positioning provides separate weekly context.
  caveat: Reporting-time uncertainty and simultaneity prevent a price-impact interpretation.
  svg_required: true
  visual_qa_status: pass_2026-07-20_full_size_thumbnail_svg_readme_pdf
- figure_id: leverage_tail_connectedness
  filename: research/03_derivatives_leverage_liquidations/figures/03_leverage_tail_connectedness.png
  root_order: 4
  status: public
  research_question: How do lagged leverage states coincide with conditional tail stress and cross-asset connectedness?
  source_tables: research/03_derivatives_leverage_liquidations/tables/leverage_tail_model.csv; research/03_derivatives_leverage_liquidations/tables/connectedness.csv
  chart_type: spline_marginal_association_and_generalized_fevd
  method: Lagged-state spline logistic marginal associations plus rolling generalized FEVD connectedness
  units: conditional probability and connectedness percent
  uncertainty: Bootstrap intervals for state associations; FEVD stability and row-sum diagnostics
  date_range: 2020-02-01 through 2026-06-30, model-specific support
  sample: BTC state model, 2020-02-01 through 2026-04-12; S2 connectedness from 2021
  caption: Tail probabilities vary nonlinearly over observed leverage support, while stable-core connectedness changes through time.
  caveat: These are stress-state associations, not forecasts, trading signals, or liquidation-cause estimates.
  svg_required: true
  visual_qa_status: pass_2026-07-20_full_size_thumbnail_svg_readme_pdf
- figure_id: pit_concentration_turnover
  filename: research/07_chain_fundamentals_sector_dynamics/figures/07_pit_concentration_turnover.png
  root_order: 5
  status: public
  research_question: How did point-in-time effective breadth and top-100 membership turnover change?
  source_tables: research/07_chain_fundamentals_sector_dynamics/tables/pit_concentration.csv; research/07_chain_fundamentals_sector_dynamics/tables/pit_membership_transitions.csv
  chart_type: effective_breadth_and_membership_turnover
  method: Complete monthly PIT top-100 census with entropy breadth, turnover, and exact HHI decomposition
  units: entropy-implied asset count and monthly turnover rate
  uncertainty: Descriptive monthly census; exact decomposition residual is reported as a diagnostic
  date_range: 2020-01-31 through 2026-05-31
  sample: Complete monthly PIT top-100 snapshots, January 2020 through May 2026
  caption: Effective market breadth and constituent turnover changed materially across complete monthly snapshots.
  caveat: Monthly PIT evidence supports market-structure statements only, not daily historical constituent performance.
  svg_required: true
  visual_qa_status: pass_2026-07-20_full_size_thumbnail_svg_readme_pdf
- figure_id: data_governance_inventory
  filename: research/00_data_measurement_foundation/figures/data_governance_inventory.png
  root_order: 90
  status: module
  research_question: Which local provider and feature dispositions govern public claims?
  source_tables: research/00_data_measurement_foundation/tables/provider_inventory.csv; research/00_data_measurement_foundation/tables/feature_usage_matrix.csv
  chart_type: governance_inventory_bar
  method: Deterministic raw-object and registered-feature inventory counts
  units: counts
  uncertainty: Census of available local objects and registry rows; no sampling interval applies
  date_range: Inventory frozen at the 2026-06-30 acquisition cutoff
  sample: Local-only provider inventory frozen at 2026-06-30
  caption: Provider and feature dispositions define release and measurement boundaries.
  caveat: Release-risk labels are not legal permission.
  svg_required: true
  visual_qa_status: pass_2026-07-20_full_size_thumbnail_svg_readme_pdf
- figure_id: coverage_missingness_by_block
  filename: research/00_data_measurement_foundation/figures/coverage_missingness_by_block.png
  root_order: 89
  status: module
  research_question: How do valid daily observations and missingness differ across registered data blocks?
  source_tables: research/00_data_measurement_foundation/tables/coverage_missingness.csv
  chart_type: coverage_and_missingness_bar
  method: Contract-calendar non-missing coverage summarized by registered research block
  units: observation counts and missing share
  uncertainty: Deterministic coverage audit; no sampling interval applies
  date_range: Source-specific valid starts through 2026-06-30
  sample: Contract-valid source coverage frozen at 2026-06-30
  caption: Coverage differs across source blocks because their valid starts and native calendars differ.
  caveat: Missingness is evaluated against each source contract rather than a universal daily calendar.
  svg_required: true
  visual_qa_status: pass_2026-07-20_full_size_thumbnail_svg_readme_pdf
- figure_id: liquidity_measurement_diagnostics
  filename: research/05_stablecoin_defi_liquidity/figures/05_liquidity_measurement_diagnostics.png
  root_order: 91
  status: appendix
  research_question: What remains after price-adjusting USD TVL growth, and how mechanical is same-day MVRV?
  source_tables: research/05_stablecoin_defi_liquidity/tables/liquidity_state.csv; research/05_stablecoin_defi_liquidity/tables/measurement_mechanics.csv
  chart_type: residual_state_and_measurement_warning
  method: HAC residualization of USD TVL growth plus same-day MVRV identity diagnostic
  units: rolling z-score and correlation
  uncertainty: HAC coefficient intervals; MVRV panel is a descriptive measurement-mechanics diagnostic
  date_range: 2020-01-02 through 2026-04-14
  sample: Daily BTC/ETH liquidity and measurement panel through 2026-04-14
  caption: The liquidity residual is endogenous, and MVRV mechanics remain an appendix warning.
  caveat: Raw USD TVL is valuation-sensitive and same-day MVRV is not an independent factor.
  svg_required: true
  visual_qa_status: pass_2026-07-20_full_size_thumbnail_svg_readme_pdf
- figure_id: event_atlas_appendix
  filename: research/09_event_stress_cross_module_synthesis/figures/09_event_atlas_appendix.png
  root_order: 92
  status: appendix
  research_question: How do registered post-event windows vary across BTC and ETH?
  source_tables: research/09_event_stress_cross_module_synthesis/tables/event_response_matrix.csv
  chart_type: event_response_heatmap
  method: Registered fixed post-event windows compared with non-overlapping empirical placebo windows
  units: cumulative log return
  uncertainty: Empirical placebo percentiles and two-sided placebo p-values; not an identification design
  date_range: Event dates 2022-05-09 through 2024-08-05 with return support through 2026-04-14
  sample: Registered events within the valid 2020-2026 BTC/ETH panel
  caption: Event responses are retained as appendix sensitivity evidence.
  caveat: Event windows are not an identification design.
  svg_required: true
  visual_qa_status: pass_2026-07-20_full_size_thumbnail_svg_readme_pdf
